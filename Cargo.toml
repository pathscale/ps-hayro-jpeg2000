[package]
name = "ps-hayro-jpeg2000"
version = "0.5.0"
description = "A memory-safe, pure-Rust JPEG 2000 decoder: pathscale fork of hayro-jpeg2000."
authors = ["Laurenz Stampfl <laurenz.stampfl@gmail.com>", "PathScale"]
edition = "2024"
rust-version = "1.92"
repository = "https://github.com/pathscale/ps-hayro-jpeg2000"
license = "Apache-2.0 OR MIT"
readme = "README.md"
keywords = ["jpeg2000", "jp2", "image", "decoder", "no_std"]
categories = ["multimedia::images", "no-std"]

[lib]
name = "hayro_jpeg2000"

[dependencies]
fearless_simd = { version = "1.0.0", optional = true }

[features]
default = ["std"]
# Enable std library support. Disable for no_std environments.
std = []
# Enable SIMD via `fearless_simd`.
simd = ["fearless_simd", "std"]

[lints.rust]
keyword_idents_2024 = "forbid"
non_ascii_idents = "forbid"
non_local_definitions = "forbid"
unsafe_op_in_unsafe_fn = "forbid"
elided_lifetimes_in_paths = "warn"
missing_docs = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
