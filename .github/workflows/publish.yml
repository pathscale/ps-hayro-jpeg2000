name: Publish crate

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full commit SHA reviewed and locally checked before dispatch
        required: true
        type: string
      local_checks_attested:
        description: Confirm affected local checks and cargo publish --dry-run passed for this commit
        required: true
        type: choice
        options:
          - 'no'
          - 'yes'
        default: 'no'

permissions:
  contents: read

concurrency:
  group: cargo-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master' && inputs.local_checks_attested == 'yes'
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the reviewed commit
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -eu
          export LC_ALL=C
          case "$EXPECTED_COMMIT" in
            ''|*[!0-9a-f]*) echo "expected_commit must be a full lowercase hexadecimal SHA" >&2; exit 1 ;;
          esac
          [ "${#EXPECTED_COMMIT}" -eq 40 ] || { echo "expected_commit must be a full 40-character SHA" >&2; exit 1; }
          actual_commit=$(git rev-parse HEAD)
          [ "$actual_commit" = "$EXPECTED_COMMIT" ] || { echo "checked out commit does not match expected_commit" >&2; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish the manifest version to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          LOCAL_CHECKS_ATTESTED: ${{ inputs.local_checks_attested }}
        run: bash scripts/publish-crate.sh
